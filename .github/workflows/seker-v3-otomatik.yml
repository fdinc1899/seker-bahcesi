      - name: Degisiklikleri GitHub'a kaydet
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- lib/candy_art.dart test/v3_visual_upgrade_test.dart
          if git diff --cached --quiet; then
            echo "V3 dosyalari zaten guncel."
            exit 0
          fi
          git commit -m "feat: Seker Bahcesi V3 gorsel efektler"
          git push

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Paketleri indir
        run: flutter pub get

      - name: Testleri calistir
        run: flutter test

      - name: APK olustur
        run: flutter build apk --release

      - name: APK dosyasini paylas
        uses: actions/upload-artifact@v4
        with:
          name: seker-bahcesi-v3-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
