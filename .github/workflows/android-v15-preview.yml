name: Seker Bahcesi V15 Premium APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Android kaynaklarini olustur
        run: flutter create --platforms=android --project-name seker_bahcesi .
      - name: Kalici V15 imzasi ve paket kimligi
        env:
          SEKER_V15_P12_B64: ${{ secrets.SEKER_V15_P12_B64 }}
          SEKER_SIGN_PASSWORD: ${{ secrets.SEKER_V15_SIGN_PASSWORD }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, os, re
          from pathlib import Path
          pwd=os.getenv('SEKER_SIGN_PASSWORD','')
          secret=os.getenv('SEKER_V15_P12_B64','')
          if not pwd or not secret:
              raise SystemExit('V15 imza sirri eksik: APK uretimi guvenlik icin durduruldu')
          p12=Path('android/app/v15-signing.p12')
          p12.write_bytes(base64.b64decode(secret,validate=True))
          p=Path('android/app/build.gradle.kts')
          if not p.exists():
              raise SystemExit('V15 Gradle Kotlin DSL bekleniyor; farkli yapi bulundu')
          code=p.read_text()
          code,count=re.subn(r'(?m)^(\s*applicationId\s*=\s*)"[^"]+"',
                  r'\g<1>"com.sekerbahcesi.v15onizleme"',code,count=1)
          if count!=1: raise SystemExit('applicationId degistirilemedi')
          new='''    signingConfigs {
                  create("v15Preview") {
                      storeFile = file("v15-signing.p12")
                      storePassword = System.getenv("SEKER_SIGN_PASSWORD")
                      keyAlias = "seker-v15"
                      keyPassword = System.getenv("SEKER_SIGN_PASSWORD")
                      storeType = "pkcs12"
                  }
              }
              buildTypes {
                  getByName("debug") {
                      signingConfig = signingConfigs.getByName("v15Preview")
                  }
              }
          '''
          # Place before buildTypes, after defaultConfig, not within another block.
          needle='    buildTypes {'
          if needle not in code: raise SystemExit('Gradle buildTypes bulunamadi')
          code=code.replace(needle,new+needle,1)
          p.write_text(code)
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          if manifest.exists():
              xml=manifest.read_text()
              xml=re.sub(r'android:label="[^"]*"', 'android:label="Şeker Bahçesi V15"', xml,count=1)
              manifest.write_text(xml)
          PY
      - name: Android Turkce konusma servisini bildir
        shell: bash
        run: |
          python3 - <<'PYTTS'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          if not manifest.is_file():
              raise SystemExit('AndroidManifest.xml bulunamadi')
          data = manifest.read_text()
          service = 'android.intent.action.TTS_SERVICE'
          if service not in data:
              if '<queries>' in data:
                  data = data.replace('</queries>',
                      '    <intent>\n'
                      '      <action android:name="' + service + '" />\n'
                      '    </intent>\n  </queries>', 1)
              elif '<application' in data:
                  data = data.replace('<application',
                      '<queries>\n'
                      '    <intent>\n'
                      '      <action android:name="' + service + '" />\n'
                      '    </intent>\n  </queries>\n  <application', 1)
              else:
                  raise SystemExit('AndroidManifest beklenen formatta degil')
              manifest.write_text(data)
          PYTTS
      - name: Paketleri kur
        run: flutter pub get
      - name: Uygulama ikonunu olustur
        run: dart run flutter_launcher_icons
      - name: Testleri calistir
        run: flutter test
      - name: V15 APK olustur
        env:
          SEKER_SIGN_PASSWORD: ${{ secrets.SEKER_V15_SIGN_PASSWORD }}
        run: flutter build apk --debug
      - name: V15 APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: Seker_Bahcesi_V15_Preview
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
          if-no-files-found: error
