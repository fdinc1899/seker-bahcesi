name: seker_bahcesi
description: Ozgun, animasyonlu, bolumlu Turkce seker eslestirme oyunu.
publish_to: 'none'
version: 2.8.3+22
environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  audioplayers: ^6.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/app_icon.png
  remove_alpha_ios: true
